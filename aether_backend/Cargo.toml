[package]
name = "aether_backend"
version = "0.1.0"
edition = "2024"


[dependencies]
actix-web = "4.11.0"
bytes = "1"
chrono = "0.4.41"
crc32c = "0.6"
dotenv = "0.15.0"
futures = "0.3"
hex = "0.4"
infer = "0.19.0"
md-5 = "0.11"
memchr = "2"
redb = "4"
rmp-serde = "1"
sea-orm = { version = "1.1.13", features = ["sqlx-sqlite", "runtime-async-std-native-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.140"
thiserror = "2"
tokio = { version = "1.46.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.26", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tempfile = "3"
