[package]
name = "aether_backend"
version = "0.1.0"
edition = "2024"


[dependencies]
actix-web = "4.11.0"
chrono = "0.4.41"
dotenv = "0.15.0"
infer = "0.19.0"
sea-orm = { version = "1.1.13", features = ["sqlx-sqlite", "runtime-async-std-native-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["full"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.17.0", features = ["v4"] }
