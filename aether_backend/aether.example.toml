# Aether configuration. Copy to aether.toml, or pass --config <file>.
# Every setting can also come from the environment: AETHER_<SECTION>__<KEY>,
# e.g. AETHER_S3__SECRET_KEY. Environment variables win over this file.

[storage]
# Metadata database (meta.redb) and block files live here.
data_dir = "data"
# Uploads are split into blocks of at most this many bytes (min 1 MiB).
block_size = 67108864        # 64 MiB
# Objects up to this size are stored inside the metadata database.
inline_threshold = 4096

[s3]
listen = "0.0.0.0:9000"
# Region clients sign requests for. Use the same value in your SDK config.
region = "us-east-1"
# Root credentials (required). Prefer AETHER_S3__ACCESS_KEY / AETHER_S3__SECRET_KEY
# over writing the secret here.
access_key = ""
secret_key = ""
# Largest single PUT in bytes (S3's limit is 5 GiB).
max_object_size = 5368709120
# Accept legacy Signature Version 2 requests and presigned URLs. Prefer
# configuring clients for SigV4; boto3, for example, presigns URLs with SigV2
# unless given Config(signature_version="s3v4").
allow_sig_v2 = false
# Accept customer-provided encryption keys (SSE-C) over plain HTTP. They are
# refused unless the S3 API uses TLS, since the key is sent in the request
# headers; enable this only behind a proxy that terminates TLS.
allow_sse_c_over_http = false
# The URL clients use to reach this API (scheme, host and port), shown in the
# web console and used in its share links. Unset: the host the console was
# opened on, with the port of `listen`.
# public_url = "https://s3.internal:9000"
# Base domains for virtual-hosted-style requests: with "s3.example.com",
# photos.s3.example.com/key addresses bucket "photos". Needs wildcard DNS
# (*.s3.example.com) and, with TLS, a wildcard certificate. Requests to any
# other host, the domain itself included, stay path-style.
# domains = ["s3.example.com"]

[admin]
# JSON API for access keys, permissions, buckets, objects and usage, and the
# web console. Requests use HTTP Basic auth with the root key or an admin
# access key, or a console session. Loopback only by default.
enabled = true
listen = "127.0.0.1:9001"
# Serve the web console at http://<listen>/.
console = true

[tls]
# HTTPS: set both files (PEM) to serve the S3 API over TLS. Renewed files are
# picked up without a restart. The certificate must be a server (end-entity)
# certificate, not a CA: for a self-signed one, add
#   -addext "basicConstraints=critical,CA:FALSE"
# to `openssl req -x509`.
# cert_file = "/etc/aether/tls.crt"
# key_file = "/etc/aether/tls.key"
# Also serve the admin API over TLS with the same certificate.
admin = false
# How often to check the files for changes, in seconds. 0 disables reloading.
reload_secs = 60

[http]
# Time allowed to send request headers (protects against slow clients).
header_timeout_secs = 30
handshake_timeout_secs = 10
# An upload that sends no data for this long is aborted with RequestTimeout.
body_timeout_secs = 60
# On shutdown (SIGTERM), how long in-flight requests may take to finish.
shutdown_timeout_secs = 30

[gc]
# Blocks of deleted or overwritten objects are kept this long so downloads
# already in progress can finish.
grace_secs = 900
interval_secs = 30
# Leftovers from interrupted uploads are removed after this long.
orphan_grace_secs = 3600
sweep_interval_secs = 3600
# Multipart uploads not completed within this time are aborted and their parts
# deleted. 0 keeps them forever.
abandoned_upload_secs = 604800   # 7 days

[scrub]
# Re-read every block and verify its checksum this often. 0 disables.
interval_secs = 604800   # 7 days
# Read rate limit while scrubbing, in bytes per second. 0: unlimited.
bytes_per_sec = 67108864 # 64 MiB/s

[encryption]
# Encrypt every new object at rest (SSE-S3): 32 random bytes, base64-encoded,
# e.g. from `openssl rand -base64 32`. Prefer AETHER_ENCRYPTION__MASTER_KEY.
# Keep a copy apart from the data: without it, encrypted objects are lost.
# master_key = ""
# After replacing the master key, list the old one here so objects it
# encrypted stay readable.
# previous_keys = []

[lifecycle]
# Apply buckets' lifecycle rules this often, in seconds. 0 disables.
interval_secs = 3600
# Seconds in a lifecycle "day". Only change it to test rules quickly.
day_secs = 86400

[log]
# Filter directive; RUST_LOG overrides it. The S3 protocol library's own
# per-request error logs stay off unless named, e.g. "info,s3s=debug".
level = "info"
# "text" or "json"
format = "text"
# One line per request (target "aether::access"): method, path, status,
# operation, access key, peer, duration and request id. Query strings are
# never logged.
access_log = true
