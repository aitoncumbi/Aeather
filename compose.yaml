# Single-node Aether. Set the root credentials first:
#
#   cp .env.example .env    # then edit .env
#   docker compose up -d
#   docker compose exec aether aether key create my-app --grant my-bucket=rw
#
# The S3 API is published on port 9000. The admin API, the web console
# (http://127.0.0.1:9001/) and /metrics are published on the host's loopback
# interface only.

services:
  aether:
    build: .
    image: aether:latest
    restart: unless-stopped
    environment:
      AETHER_S3__ACCESS_KEY: ${AETHER_ROOT_ACCESS_KEY:?set AETHER_ROOT_ACCESS_KEY in .env}
      AETHER_S3__SECRET_KEY: ${AETHER_ROOT_SECRET_KEY:?set AETHER_ROOT_SECRET_KEY in .env}
      AETHER_LOG__FORMAT: json
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - aether-data:/data
    # Longer than http.shutdown_timeout_secs, so in-flight requests can finish.
    stop_grace_period: 40s

volumes:
  aether-data:
